<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Riftboard  League Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--bg:#080b15;--surface:#101625;--surface-2:#151d2e;--line:#253149;--line-light:#30405d;--text:#e9eef9;--muted:#8995ad;--cyan:#67e8f9;--violet:#a78bfa;--green:#45e0a3;--red:#fb7185;--gold:#f4c76b;--shadow:0 24px 70px #0005}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:'DM Sans',sans-serif;background:radial-gradient(900px 500px at 10% -10%,#44317b44,transparent 65%),radial-gradient(800px 500px at 100% 10%,#126b7840,transparent 60%),var(--bg);padding:32px 20px 72px}.wrap{max-width:1180px;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:58px}.brand{display:flex;align-items:center;gap:12px;font:700 18px 'Space Grotesk';letter-spacing:-.03em}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border:1px solid #67e8f980;border-radius:12px;background:linear-gradient(135deg,#67e8f922,#a78bfa33);color:var(--cyan);box-shadow:0 0 26px #67e8f922}.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.live i{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 12px var(--green)}.hero{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:30px}.eyebrow{color:var(--cyan);font:600 11px 'Space Grotesk';letter-spacing:.16em;text-transform:uppercase;margin:0 0 12px}.hero h1{font:700 clamp(34px,5vw,56px) 'Space Grotesk';letter-spacing:-.065em;line-height:1.02;margin:0 0 15px}.hero p{max-width:580px;color:var(--muted);line-height:1.7;font-size:14px;margin:0}.hero-orb{width:150px;height:150px;flex:0 0 150px;border-radius:50%;background:radial-gradient(circle,#67e8f933,#67e8f900 68%);border:1px solid #67e8f933;box-shadow:inset 0 0 40px #a78bfa18,0 0 50px #67e8f91a}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px}.primary,.add-btn{border-radius:10px;padding:11px 16px;font:600 13px 'DM Sans';cursor:pointer;transition:.2s}.primary{border:0;color:#06131c;background:linear-gradient(135deg,var(--cyan),#5eead4);box-shadow:0 8px 24px #67e8f926}.primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px #67e8f94d}.primary:disabled{opacity:.5;cursor:not-allowed;transform:none}.queue-select,.name-input,.tag-input,.lp-input,.region-select{color:var(--text);background:#0b1120;border:1px solid var(--line);border-radius:8px;font:500 12px 'DM Sans';outline:none}.queue-select{padding:11px 13px;background-color:var(--surface-2);font-size:13px}.status-msg{color:var(--muted);font-size:12px;margin-left:4px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat{position:relative;overflow:hidden;background:linear-gradient(145deg,#151d2d,#0f1523);border:1px solid var(--line);border-radius:16px;padding:19px 20px;box-shadow:var(--shadow)}.stat:after{content:'';position:absolute;width:70px;height:70px;right:-22px;top:-28px;border-radius:50%;background:#67e8f91a}.stat .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.stat .value{font:700 25px 'Space Grotesk';margin-top:9px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat:nth-child(2) .value{color:var(--violet)}.stat:nth-child(3) .value{color:var(--green)}.stat:nth-child(4) .value{color:var(--gold)}.panel{overflow:hidden;background:#101625cc;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}.panel-head,.panel-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:20px 24px}.panel-head{border-bottom:1px solid var(--line)}.panel-head h2{font:600 17px 'Space Grotesk';margin:0}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.save-tag{color:var(--green);font-size:11px}.save-tag:before{content:'';margin-right:6px;font-size:8px}table{width:100%;border-collapse:collapse}thead th{text-align:left;color:#71809a;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;padding:14px 12px;border-bottom:1px solid var(--line)}thead th:first-child,tbody td:first-child{padding-left:24px}thead th:last-child,tbody td:last-child{padding-right:24px}tbody td{padding:12px;border-bottom:1px solid #202a3d;font-size:13px;vertical-align:middle}tbody tr:hover{background:#67e8f908}.name-input,.tag-input,.lp-input,.region-select{padding:8px}.name-input:focus,.tag-input:focus,.lp-input:focus,.region-select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #67e8f914}.name-input{width:116px}.tag-input{width:64px;margin-left:4px}.region-select{width:142px}.tier-cell{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--gold);font-size:12px}.hex-badge{width:18px;height:18px;display:inline-block;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}.lp-input{width:58px;text-align:center;color:var(--gold);font-family:'Space Grotesk'}.wl-cell{display:flex;align-items:center;gap:5px}.wl-count{min-width:18px;text-align:center;font:600 12px 'Space Grotesk'}.win{color:var(--green)}.loss{color:var(--red)}button.stepper{width:21px;height:21px;padding:0;border:1px solid var(--line);border-radius:6px;background:#172136;color:var(--muted);cursor:pointer}button.stepper:hover{border-color:var(--cyan);color:var(--cyan)}.games-cell{color:var(--muted)}.row-actions{display:flex;gap:6px;align-items:center}.icon-btn,.remove-btn{cursor:pointer;border-radius:7px}.icon-btn{padding:7px 9px;color:var(--cyan);border:1px solid #67e8f944;background:#67e8f90b}.icon-btn:hover{background:#67e8f921}.remove-btn{padding:5px 8px;color:var(--muted);border:0;background:transparent;font-size:17px}.remove-btn:hover{color:var(--red)}.panel-foot{border-top:1px solid var(--line)}.add-btn{color:var(--cyan);border:1px solid #67e8f966;background:#67e8f90d;padding:10px 14px}.add-btn:hover{background:#67e8f91e}.add-btn:disabled{opacity:.35;cursor:not-allowed}.count-note{color:var(--muted);font-size:12px}.empty{padding:68px 22px;text-align:center;color:var(--muted);font-size:14px}.empty strong{display:block;color:var(--text);font:600 18px 'Space Grotesk';margin-bottom:8px}.err-text{color:var(--red);font-size:11px;padding-top:0!important}@media(max-width:850px){.summary{grid-template-columns:repeat(2,1fr)}.hero-orb{display:none}.panel{overflow-x:auto}.panel-head,.panel-foot{min-width:760px}.panel table{min-width:920px}}@media(max-width:560px){body{padding:22px 14px 50px}.topbar{margin-bottom:42px}.live{display:none}.hero{margin-bottom:25px}.hero h1{font-size:39px}.summary{gap:9px}.stat{padding:15px 14px}.stat .value{font-size:21px}.stat:nth-child(4) .value{font-size:16px}.toolbar .primary{flex:1}.queue-select{flex:1}.panel-head,.panel-foot{padding-left:17px;padding-right:17px}}
</style></head><body><main class="wrap"><nav class="topbar"><div class="brand"><span class="brand-mark"></span> RIFTBOARD</div><span class="live"><i></i> Datos sincronizados con Riot</span></nav><section class="hero"><div><h1>Tu lobby,<br><span style="color:var(--cyan)">en nmeros.</span></h1><p>Organiza tu grupo de clasificatoria y consulta rango, LP y rendimiento de cada cuenta desde un solo lugar.</p></div><div class="hero-orb" aria-hidden="true"></div></section><div class="toolbar"><button class="primary" id="refreshAllBtn"> &nbsp; Actualizar todos</button><select class="queue-select" id="queueSelect" aria-label="Cola clasificatoria"><option value="solo">Solo / Duo</option><option value="flex">Flex</option></select><span class="status-msg" id="statusMsg"></span></div><section class="summary" id="summary"></section><section class="panel"><header class="panel-head"><div><h2>Tabla de invocadores</h2><p>Tu escuadra en una vista rpida</p></div><div class="save-tag" id="saveTag">Guardado local</div></header><div id="tableWrap"></div><footer class="panel-foot"><button class="add-btn" id="addBtn"> Aadir jugador</button><span class="count-note" id="countNote"></span></footer></section></main>
<script>
const TIERS_COLOR={IRON:'#696760',BRONZE:'#a66a3f',SILVER:'#aeb9c4',GOLD:'#f4c76b',PLATINUM:'#50c9bd',EMERALD:'#45c985',DIAMOND:'#7792ff',MASTER:'#c17bea',GRANDMASTER:'#f06b6b',CHALLENGER:'#ffe083','':'#526078'};
const REGIONS=[{id:'na1',name:'Norteamrica',short:'NA'},{id:'euw1',name:'Europa Oeste',short:'EUW'},{id:'eun1',name:'Europa Nrdica',short:'EUNE'},{id:'kr',name:'Corea',short:'KR'},{id:'br1',name:'Brasil',short:'BR'},{id:'la1',name:'LAN',short:'LAN'},{id:'la2',name:'LAS',short:'LAS'},{id:'oc1',name:'Oceana',short:'OCE'},{id:'tr1',name:'Turqua',short:'TR'},{id:'ru',name:'Rusia',short:'RU'},{id:'jp1',name:'Japn',short:'JP'}];
const STORAGE_KEY='lol-tracker-players-v1',HISTORY_KEY='lol-tracker-riot-id-history-v1',MAX_PLAYERS=10,API_BASE=window.location.origin;let players=[],riotIdHistory=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2,9);const winrate=p=>{const t=(p.wins||0)+(p.losses||0);return t?Math.round((p.wins/t)*10000)/100:0};const save=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(players));const load=()=>{try{players=JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}catch(e){players=[]}};const saveHistory=()=>localStorage.setItem(HISTORY_KEY,JSON.stringify(riotIdHistory));const loadHistory=()=>{try{riotIdHistory=JSON.parse(localStorage.getItem(HISTORY_KEY))||[]}catch(e){riotIdHistory=[]}};const normalizeTagLine=t=>String(t||'').trim().replace(/^#/,'');
function parseRiotId(text){const raw=String(text||'').trim(),i=raw.indexOf('#');if(i<=0||i>=raw.length-1)return null;const gameName=raw.slice(0,i).trim(),tagLine=normalizeTagLine(raw.slice(i+1));return gameName&&tagLine?{gameName,tagLine}:null}function upsertHistory(gameName,tagLine,region){const key=`${gameName}#${tagLine}`.toLowerCase();riotIdHistory=riotIdHistory.filter(x=>`${x.gameName}#${x.tagLine}`.toLowerCase()!==key);riotIdHistory.unshift({gameName,tagLine:normalizeTagLine(tagLine),region:(region||'na1').toLowerCase()});riotIdHistory=riotIdHistory.slice(0,30);saveHistory()}function regionOptions(sel){return REGIONS.map(r=>`<option value="${r.id}" ${r.id===sel?'selected':''}>${r.name} (${r.short})</option>`).join('')}
function render(){const sorted=[...players].sort((a,b)=>winrate(b)-winrate(a)||(b.lp||0)-(a.lp||0)),wrap=document.getElementById('tableWrap');if(!sorted.length){wrap.innerHTML='<div class="empty"><strong>An no hay jugadores</strong>Aade tu primera cuenta para empezar a seguir la temporada.</div>'}else{wrap.innerHTML=`<table><thead><tr><th>#</th><th>Cuenta</th><th>Servidor</th><th>Rango</th><th>LP</th><th>V</th><th>D</th><th>PJ</th><th>Winrate</th><th></th></tr></thead><tbody>${sorted.map((p,i)=>{const wr=winrate(p),games=(p.wins||0)+(p.losses||0);return `<tr data-id="${p.id}"><td style="color:var(--muted)">${String(i+1).padStart(2,'0')}</td><td><input class="name-input" data-field="gameName" value="${esc(p.gameName)}" placeholder="Nombre"/><input class="tag-input" data-field="tagLine" value="${esc(p.tagLine)}" placeholder="TAG"/></td><td><select class="region-select" data-field="region">${regionOptions(p.region||'na1')}</select></td><td class="tier-cell"><span class="hex-badge" style="background:${TIERS_COLOR[p.tier]||TIERS_COLOR['']}"></span>${esc(p.tier?`${p.tier} ${p.rank||''}`.trim():'Sin datos')}</td><td><input class="lp-input" type="number" min="0" data-field="lp" value="${p.lp||0}"/></td><td><div class="wl-cell"><span class="wl-count win">${p.wins||0}</span></div></td><td><div class="wl-cell"><span class="wl-count loss">${p.losses||0}</span></div></td><td class="games-cell">${games}</td><td class="winrate-cell" style="color:${wr>=50?'var(--green)':'var(--red)'}">${wr.toFixed(2)}%</td><td class="row-actions"><button class="icon-btn" data-action="refresh" title="Consultar Riot">Actualizar</button><button class="remove-btn" data-action="remove" title="Eliminar">Eliminar</button></td></tr>${p.error?`<tr><td></td><td colspan="9" class="err-text">${esc(p.error)}</td></tr>`:''}`}).join('')}</tbody></table>`;wrap.querySelectorAll('tr[data-id]').forEach(tr=>{const p=players.find(x=>x.id===tr.dataset.id);const bind=(sel,field,parse)=>tr.querySelector(sel)?.addEventListener('change',e=>{p[field]=parse?parse(e.target.value):e.target.value;save();render()});bind('[data-field="gameName"]','gameName');bind('[data-field="tagLine"]','tagLine',normalizeTagLine);bind('[data-field="region"]','region');bind('[data-field="lp"]','lp',v=>Math.max(0,parseInt(v,10)||0));['inc-win','dec-win','inc-loss','dec-loss'].forEach(a=>tr.querySelector(`[data-action="${a}"]`)?.addEventListener('click',()=>{const f=a.includes('win')?'wins':'losses';p[f]=Math.max(0,(p[f]||0)+(a.startsWith('inc')?1:-1));save();render()}));tr.querySelector('[data-action="remove"]').addEventListener('click',()=>{players=players.filter(x=>x.id!==p.id);save();render()});tr.querySelector('[data-action="refresh"]').addEventListener('click',()=>refreshPlayer(p))})}document.getElementById('addBtn').disabled=players.length>=MAX_PLAYERS;document.getElementById('countNote').textContent=`${players.length} / ${MAX_PLAYERS} jugadores`;renderSummary(sorted)}
function renderSummary(s){const el=document.getElementById('summary');if(!s.length){el.innerHTML='';return}const games=s.reduce((a,p)=>a+(p.wins||0)+(p.losses||0),0),wins=s.reduce((a,p)=>a+(p.wins||0),0);el.innerHTML=`<div class="stat"><div class="label">Jugadores</div><div class="value">${s.length}</div></div><div class="stat"><div class="label">Partidas totales</div><div class="value">${games}</div></div><div class="stat"><div class="label">Winrate del grupo</div><div class="value">${games?(wins/games*100).toFixed(2):'0.00'}%</div></div><div class="stat"><div class="label">Lder de la tabla</div><div class="value">${esc(s[0].gameName||'')}</div></div>`}async function refreshPlayer(p){const parsed=parseRiotId(p.gameName);if(parsed){p.gameName=parsed.gameName;p.tagLine=parsed.tagLine}p.tagLine=normalizeTagLine(p.tagLine);if(!p.gameName||!p.tagLine){p.error='Riot ID invalido. Usa formato Nombre#TAG';render();return}p.error=null;try{const q=document.getElementById('queueSelect').value,url=`${API_BASE}/api/jugador?gameName=${encodeURIComponent(p.gameName)}&tagLine=${encodeURIComponent(p.tagLine)}&region=${p.region||'na1'}&queue=${q}`,res=await fetch(url),data=await res.json();if(!res.ok){p.error=data.error||'Error consultando Riot';return}if(data.ranked){Object.assign(p,{tier:data.ranked.tier,rank:data.ranked.rank,lp:data.ranked.lp,wins:data.ranked.wins,losses:data.ranked.losses,error:null});upsertHistory(p.gameName,p.tagLine,p.region)}else p.error='Cuenta encontrada pero sin partidas en esa cola'}catch(e){p.error='No se pudo conectar con el backend. Inicia con npm run dev:netlify'}save();render()}
document.getElementById('refreshAllBtn').addEventListener('click',async()=>{const b=document.getElementById('refreshAllBtn'),s=document.getElementById('statusMsg');b.disabled=true;for(let i=0;i<players.length;i++){s.textContent=`Actualizando ${i+1}/${players.length}`;await refreshPlayer(players[i]);await new Promise(r=>setTimeout(r,250))}s.textContent='Todo al da';b.disabled=false;setTimeout(()=>s.textContent='',2200)});document.getElementById('addBtn').addEventListener('click',()=>{if(players.length>=MAX_PLAYERS)return;players.push({id:uid(),gameName:'',tagLine:'',region:'na1',tier:'',rank:'',lp:0,wins:0,losses:0});save();render()});load();loadHistory();render();
</script></body></html>
