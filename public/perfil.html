<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil | Riftboard</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap');:root{--bg:#080b15;--card:#111929;--line:#293650;--text:#edf2fb;--muted:#8b99b2;--cyan:#67e8f9;--violet:#a78bfa;--green:#45e0a3;--red:#fb7185;--gold:#f4c76b}*{box-sizing:border-box}body{margin:0;padding:30px 20px 70px;background:radial-gradient(800px 500px at 10% -10%,#43327b44,transparent 65%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}.wrap{max-width:1050px;margin:auto}.back{color:var(--cyan);text-decoration:none;font-size:13px}.head{display:flex;align-items:center;gap:22px;margin:35px 0}.avatar{width:108px;height:108px;border-radius:26px;border:1px solid var(--cyan);object-fit:cover;background:#192338}.head h1{font:700 38px 'Space Grotesk';margin:0 0 8px}.head p{margin:0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}.card{background:linear-gradient(145deg,#151f31,#101624);border:1px solid var(--line);border-radius:16px;padding:20px}.label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:15px}.champ{display:flex;gap:14px;align-items:center}.champ img{width:62px;height:62px;border-radius:14px;object-fit:cover;background:#202c44}.champ strong{display:block;font:700 18px 'Space Grotesk';margin-bottom:4px}.champ small{color:var(--muted)}.big{font:700 27px 'Space Grotesk';color:var(--green)}.panel{background:#101624dd;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:18px}.panel h2{font:600 17px 'Space Grotesk';margin:0;padding:20px 22px;border-bottom:1px solid var(--line)}.games{display:grid;grid-template-columns:repeat(2,1fr)}.game{display:flex;align-items:center;gap:13px;padding:14px 20px;border-bottom:1px solid #22304a}.game img{width:42px;height:42px;border-radius:10px;object-fit:cover}.game.win{border-left:3px solid var(--green)}.game.loss{border-left:3px solid var(--red)}.game strong{font-size:13px}.game small{display:block;color:var(--muted);margin-top:3px}.game .result{margin-left:auto;font-weight:700;font-size:12px}.win .result{color:var(--green)}.loss .result{color:var(--red)}.companions{display:flex;flex-wrap:wrap;gap:10px;padding:18px 22px}.person{padding:10px 13px;background:#182238;border:1px solid var(--line);border-radius:9px;font-size:12px}.person span{color:var(--cyan);margin-left:5px}.notice{color:var(--muted);font-size:11px;margin-top:25px}.error{text-align:center;padding:50px;color:var(--red)}@media(max-width:700px){.cards{grid-template-columns:1fr}.games{grid-template-columns:1fr}.head h1{font-size:28px}.avatar{width:80px;height:80px}}
</style></head><body><main class="wrap"><a class="back" href="index.html"> Volver al tracker</a><div id="app"><p>Cargando perfil...</p></div><p class="notice">Herramienta comunitaria no oficial. Datos de Riot Games usados para seguimiento personal; comparte perfiles solo con consentimiento.</p></main><script>
const API_BASE=window.location.origin,params=new URLSearchParams(location.search),gameName=params.get('gameName')||'',tagLine=params.get('tagLine')||'',region=params.get('region')||'la2';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=v=>v?new Date(v).toLocaleDateString('es-ES',{day:'2-digit',month:'short'}):'--';
function render(p){const m=p.mastery,b=p.bestChampion;document.getElementById('app').innerHTML=`<section class="head"><img class="avatar" src="${p.profileIcon||''}" onerror="this.style.display='none'"><div><h1>${esc(p.account.gameName)}#${esc(p.account.tagLine)}</h1><p>Nivel ${p.summonerLevel||'--'} | Servidor ${esc(p.account.region.toUpperCase())}</p></div></section><section class="cards"><article class="card"><div class="label">Mayor maestria</div>${m?`<div class="champ"><img src="${m.image||''}"><div><strong>${esc(m.name)}</strong><small>Nivel ${m.level} | ${m.points.toLocaleString()} puntos</small></div></div>`:'<p>Sin datos</p>'}</article><article class="card"><div class="label">Mejor winrate reciente</div>${b?`<div class="champ"><img src="${b.image||''}"><div><strong>${esc(b.name)}</strong><small>${b.wins} de ${b.games} partidas</small></div></div><div class="big">${b.winrate.toFixed(2)}%</div>`:'<p>Sin datos</p>'}</article><article class="card"><div class="label">Partidas recientes</div><div class="big" style="color:var(--violet)">${p.recentGames.length}</div><small>ultimas partidas de cualquier cola</small></article></section><section class="panel"><h2>Ultimas partidas</h2><div class="games">${p.recentGames.map(g=>`<div class="game ${g.win?'win':'loss'}"><img src="${g.championImage||''}"><div><strong>${esc(g.champion)}</strong><small>${esc(g.queueName)} | Fecha: ${date(g.playedAt)}</small></div><span class="result">${g.win?'Victoria':'Derrota'}</span></div>`).join('')||'<p style="padding:20px;color:var(--muted)">No hay partidas recientes.</p>'}</div></section><section class="panel"><h2>Jugadores recurrentes</h2><div class="companions">${p.recurringPlayers.map(x=>`<div class="person">${esc(x.player)}<span>${x.games} partidas</span></div>`).join('')||'<span style="color:var(--muted)">No hay compaeros recurrentes en las partidas recientes.</span>'}</div></section>`}
async function load(){try{if(!gameName||!tagLine)throw new Error('Falta un Riot ID');const res=await fetch(`${API_BASE}/api/perfil?gameName=${encodeURIComponent(gameName)}&tagLine=${encodeURIComponent(tagLine)}&region=${encodeURIComponent(region)}`),data=await res.json();if(!res.ok)throw new Error(data.error||'No se pudo cargar el perfil');render(data)}catch(e){document.getElementById('app').innerHTML=`<div class="error">${esc(e.message)}</div>`}}load();
</script></body></html>
